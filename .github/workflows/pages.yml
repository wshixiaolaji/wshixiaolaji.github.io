name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Set signaling service URL
        env:
          SIGNAL_BASE_URL: ${{ vars.SIGNAL_BASE_URL }}
        run: |
          node -e 'const fs=require("fs");const raw=process.env.SIGNAL_BASE_URL||"";const u=raw?new URL(raw):null;if(u&&u.protocol!=="https:")throw new Error("SIGNAL_BASE_URL must use HTTPS");fs.writeFileSync("dist/config.js",`window.RTC_CONFIG = { signalBase: ${JSON.stringify(u?.origin||"")} };\n`);'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
